name: Release Native Agents

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native-agent/go.mod
      - name: Build agents
        working-directory: native-agent
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/eits-agent-windows-amd64.exe ./cmd/eits-agent
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/eits-agent-linux-amd64 ./cmd/eits-agent
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/eits-agent-linux-arm64 ./cmd/eits-agent
          cp scripts/install-agent.ps1 scripts/uninstall-agent.ps1 dist/
          cp scripts/install-agent.sh scripts/uninstall-agent.sh scripts/eits-agent.service dist/
          cd dist
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: true
          files: native-agent/dist/*
