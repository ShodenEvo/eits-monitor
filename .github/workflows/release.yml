name: Release EITS Agents
on:
  push:
    tags: ['v*']
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native-agent/go.mod
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows applications
        shell: pwsh
        working-directory: native-agent
        run: |
          $Version = "${{ github.ref_name }}".TrimStart('v')
          New-Item -ItemType Directory -Force build/windows, build/installer | Out-Null
          $Ld = "-s -w -X main.version=$Version"
          go build -trimpath -ldflags "-H windowsgui $Ld" -o build/windows/eits-agent-engine.exe ./cmd/eits-agent
          go build -trimpath -ldflags "-H windowsgui $Ld" -o build/windows/eits-agent-updater.exe ./cmd/eits-agent-updater
          Copy-Item assets/windows-common-controls.manifest build/windows/eits-agent-updater.exe.manifest
          dotnet publish ../windows-agent/Eits.Agent.Manager/Eits.Agent.Manager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o build/windows
          dotnet publish ../windows-agent/Eits.Agent.Control/Eits.Agent.Control.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o build/windows
          dotnet publish ../windows-agent/Eits.Agent.Service/Eits.Agent.Service.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o build/windows
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build single EXE installer
        shell: pwsh
        working-directory: native-agent
        run: |
          $Version = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$Version" installer/eits-agent.iss
          Get-FileHash "build/installer/EITS-Agent-Setup-v$Version.exe" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  EITS-Agent-Setup-v$Version.exe" } | Set-Content build/installer/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            native-agent/build/installer/EITS-Agent-Setup-*.exe
            native-agent/build/installer/SHA256SUMS.txt

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native-agent/go.mod
      - name: Build Linux package
        working-directory: native-agent
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p build/linux
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o build/linux/eits-agent-linux-amd64 ./cmd/eits-agent
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o build/linux/eits-agent-linux-arm64 ./cmd/eits-agent
          cp scripts/install-agent.sh updater/update-agent.sh updater/eits-agent-update.service updater/eits-agent-update.timer scripts/eits-agent.service build/linux/
          (cd build/linux && sha256sum * > SHA256SUMS)
          tar -C build/linux -czf "build/eits-agent-linux-v${VERSION}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: native-agent/build/eits-agent-linux-*.tar.gz

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          body_path: .github/release-notes/${{ github.ref_name }}.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/EITS-Agent-Setup-*.exe
            release/eits-agent-linux-*.tar.gz
            release/SHA256SUMS.txt
