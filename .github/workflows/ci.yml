name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docker-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/eits-agent

  native-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native-agent/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - name: Cross compile
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o dist/eits-agent-windows-amd64.exe ./cmd/eits-agent
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o dist/eits-agent-linux-amd64 ./cmd/eits-agent
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o dist/eits-agent-linux-arm64 ./cmd/eits-agent

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m py_compile server/app/main.py
      - run: pip install -r server/requirements.txt
      - run: python -c "import sys; sys.path.insert(0, 'server'); import app.main"
        env:
          DATABASE_URL: sqlite+pysqlite:///:memory:
          SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret-key-ci-secret-key
          ADMIN_PASSWORD: ci-password
          AGENT_ENROLLMENT_TOKEN: ci-enrollment-token

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config
      - run: docker compose build
