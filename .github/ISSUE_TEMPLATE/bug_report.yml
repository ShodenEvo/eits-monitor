name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, tokens, agent identities, or other secrets.
  - type: input
    id: version
    attributes:
      label: EITS Monitor version
      placeholder: v0.3.0-alpha.1
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Web dashboard
        - API
        - PostgreSQL
        - Docker host agent
        - Native Windows agent
        - Native Linux agent
        - Installation or upgrade
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Explain what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
